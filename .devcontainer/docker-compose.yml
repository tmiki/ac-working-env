# Dev Containerのビルド時から必要な変数は、 .env ファイルにて指定する。

# コンテナ定義
services:
  working-env:
    network_mode: host

    build:
      context: .
      dockerfile: Dockerfile
      args:
        WORK_DIR: ${WORK_DIR}
        SHARED_DIR: ${SHARED_DIR}
        LOGIN_USER: ${LOGIN_USER}
        DOCKER_GID: ${DOCKER_GID}

    # ---- 環境変数 ----
    # environment:
    env_file:
      # Claude Code用APIキーなど、クレデンシャル情報を指定
      - .credential.env

    # ---- ボリューム ----
    volumes:
      # ワークスペース本体
      - type: bind
        source: ../
        target: ${SHARED_DIR}

      # 永続化ボリューム: コンテナを Rebuild しても内容を保持する作業領域
      - type: volume
        source: work_main
        target: ${WORK_DIR}

      # バインドマウント: ホストの git 設定をコンテナに引き継ぐ
      - type: bind
        source: ${HOME}/.gitconfig
        target: /home/${LOGIN_USER}/.gitconfig
        read_only: true

      # バインドマウント: SSH 鍵（git over SSH 等で使用）
      - type: bind
        source: ${HOME}/.ssh
        target: /home/${LOGIN_USER}/.ssh
        read_only: true

      # バインドマウント: AWS 認証情報（AWS CLI / SDK で使用）
      - type: bind
        source: ${HOME}/.aws
        target: /home/${LOGIN_USER}/.aws
        read_only: false

      # バインドマウント: Claude Code
      - type: bind
        source: ${HOME}/.claude
        target: /home/${LOGIN_USER}/.claude
        read_only: false

      # バインドマウント: Dockerソケット（ホストのDocker Desktopへ接続）
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock

    # ---- ポート ----
    ports:
      - "5173:5173"   # Vite dev server (React)
      - "8000:8000"   # Backend API (FastAPI 等)
      - "20022:20022"    # SSH

    # ---- 起動オプション ----
    # Dev Container が接続するまでコンテナを生かし続ける
    command: sleep infinity

    # # コンテナ内の作業ディレクトリ
    # working_dir: *WORK_DIR

# ---- ボリューム定義 ----
volumes:
  work_main:

